name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        continue-on-error: true
      - run: pnpm install

      - run: pnpm verify:p0
      - run: pnpm lint
      - run: 'echo "feat: ci smoke" | pnpm exec commitlint'
      - run: pnpm db:migrate
      - run: pnpm test:coverage
      - run: node scripts/check-e2e-route-coverage.mjs
      - run: pnpm support:flow:report
      - run: pnpm customer:reachability:report
      - run: pnpm docker:lite:startup-report
        env:
          DOCKER_LITE_STARTUP_DRY_RUN: true
      - run: pnpm copilot:adoption:report --fixture
      - run: pnpm ollama:offline:demo
      - run: pnpm kb:eval
      - run: pnpm kb:eval:report
      - run: pnpm kb:bench:local
      - run: pnpm kb:bench:api:local
        env:
          KB_API_BENCH_DURATION: 1
      - run: pnpm typecheck
      - run: pnpm --filter @keenai/docs build
      - run: pnpm --filter @keenai/auth test
      - run: pnpm verify:api-binary
      - run: pnpm alpha:acceptance
      - run: pnpm release:evidence
        env:
          SUPPORT_FLOW_REPORT_JSON: artifacts/release/support-flow.json
          CUSTOMER_REACHABILITY_REPORT_JSON: artifacts/release/customer-reachability.json
          COPILOT_ADOPTION_REPORT_JSON: artifacts/release/copilot-adoption.json
          DOCKER_LITE_STARTUP_REPORT_JSON: artifacts/release/docker-lite-startup.json
          OLLAMA_OFFLINE_REPORT_JSON: artifacts/release/ollama-offline-demo.json
          KB_EVAL_REPORT_JSON: artifacts/release/kb-eval-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: v0.2.0-release-evidence
          path: |
            artifacts/release/v0.2.0-evidence.md
            artifacts/release/support-flow.json
            artifacts/release/support-flow.md
            artifacts/release/customer-reachability.json
            artifacts/release/customer-reachability.md
            artifacts/release/copilot-adoption.json
            artifacts/release/copilot-adoption.md
            artifacts/release/docker-lite-startup.json
            artifacts/release/docker-lite-startup.md
            artifacts/release/ollama-offline-demo.json
            artifacts/release/ollama-offline-demo.md
            artifacts/release/kb-eval-report.json
            artifacts/release/kb-eval-report.md
            artifacts/release/kb-api-bench.md

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: keenai
          POSTGRES_PASSWORD: keenai
          POSTGRES_DB: keenai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U keenai"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        continue-on-error: true
      - run: pnpm install

      - name: Push Postgres schema
        env:
          PG_DSN: postgresql://keenai:keenai@localhost:5432/keenai
        run: pnpm --filter @keenai/storage db:push:pg

      - name: Postgres matrix smoke
        env:
          PG_DSN: postgresql://keenai:keenai@localhost:5432/keenai
        run: pnpm exec vitest run packages/storage/tests/pg-matrix.test.ts

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        continue-on-error: true
      - run: pnpm install

      - run: pnpm db:migrate
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
        env:
          CI: true

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - run: helm lint deploy/helm/keenai
      - run: helm template keenai deploy/helm/keenai
