[project]
name = "keenai-document-parser"
version = "0.1.0"
description = "KeenAI KB document parser sidecar"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "pydantic>=2.9.0",
  "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
docling = [
  "docling>=2.0.0",
]

[tool.ruff]
line-length = 100
